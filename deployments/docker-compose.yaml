name: alfa-hack

# Единый способ запуска всего решения (чеклист сдачи, Ограничение 06).
# Порты на хосте: go-ingest 8080, java-agent 8081, py-ml 8000, go-api 8090, llm-gateway 8091,
# postgres 15432 (не 5432 — чтобы не драться с локальным Postgres разработчика;
# внутри сети compose база по-прежнему на postgres:5432).
#
# Полный стек:        docker compose -f deployments/docker-compose.yaml up --build
# Только Go-контур:   make up-go
#
# База: у каждого сервиса своя роль с минимальными правами (миграция 00004,
# docs/SECURITY.md). Пароли ролей — переменные *_DB_PASSWORD; из коробки стоят
# dev-значения, на внешнем сервере их задают через окружение или --env-file.

x-service-env: &service-env
  env_file:
    - ../.env.example
    - path: ../.env
      required: false

# Сервис стартует, когда база поднята, миграции прогнаны и вход для ролей включён.
x-db-ready: &db-ready
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  db-roles:
    condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa}
      POSTGRES_DB: alfa
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Прогон миграций — отдельный one-shot job до старта сервисов (CLAUDE.md §5).
  # Миграции идут от владельца схемы alfa; сервисы под ним не работают.
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../internal/infra/db/postgres/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://alfa:${POSTGRES_PASSWORD:-alfa}@postgres:5432/alfa?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Включает вход для ролей сервисов и ставит им пароли из окружения.
  db-roles:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa}
      PGDATABASE: alfa
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-ingest-dev}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-dev}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-dev}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent-dev}
      PYML_DB_PASSWORD: ${PYML_DB_PASSWORD:-pyml-dev}
    volumes:
      - ./db-roles.sh:/db-roles.sh:ro
    entrypoint: ["sh", "/db-roles.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  go-ingest:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.goservice
      args:
        SERVICE: go-ingest
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      ALFA_PG_USER: svc_ingest
      ALFA_PG_PASSWORD: ${INGEST_DB_PASSWORD:-ingest-dev}
      INGEST_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: *db-ready

  llm-gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.goservice
      args:
        SERVICE: llm-gateway
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      # Роль видит только llm_calls, llm_cache, llm_budget_days — данных клиентов нет.
      ALFA_PG_USER: svc_gateway
      ALFA_PG_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-dev}
      GATEWAY_HTTP_PORT: "8091"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: *db-ready

  go-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.goservice
      args:
        SERVICE: go-api
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      ALFA_PG_USER: svc_api
      ALFA_PG_PASSWORD: ${API_DB_PASSWORD:-api-dev}
      API_HTTP_PORT: "8090"
      API_GATEWAY_BASE_URL: http://llm-gateway:8091
      API_AGENT_BASE_URL: http://java-agent:8081
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: *db-ready

  py-ml:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.pyml
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      ALFA_PG_USER: svc_ml
      ALFA_PG_PASSWORD: ${PYML_DB_PASSWORD:-pyml-dev}
      PYML_HTTP_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on: *db-ready

  java-agent:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.javaagent
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      ALFA_PG_USER: svc_agent
      ALFA_PG_PASSWORD: ${AGENT_DB_PASSWORD:-agent-dev}
      AGENT_HTTP_PORT: "8081"
      AGENT_GATEWAY_BASE_URL: http://llm-gateway:8091
    ports:
      - "8081:8081"
    depends_on:
      <<: *db-ready
      llm-gateway:
        condition: service_healthy

  # Загрузка аналитики ЦМИ: OCR PDF-сканов → research_chunks (G1-13).
  # One-shot job: повторный запуск пропускает уже загруженное, OCR-кэш
  # живёт в томе ocrcache. Ничего от него не зависит — сервисы стартуют
  # параллельно, а агент Java получит чанки, как только job закончит.
  # Файлы кладутся заранее: make data. Работает под ролью go-ingest.
  research-loader:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.research-loader
    <<: *service-env
    environment:
      ALFA_PG_HOST: postgres
      ALFA_PG_USER: svc_ingest
      ALFA_PG_PASSWORD: ${INGEST_DB_PASSWORD:-ingest-dev}
      RESEARCH_DIR: /data/research
      RESEARCH_OCR_CACHE_DIR: /cache
    volumes:
      - ../data/research:/data/research:ro
      - ocrcache:/cache
    depends_on: *db-ready
    restart: "no"

volumes:
  pgdata:
  ocrcache:
