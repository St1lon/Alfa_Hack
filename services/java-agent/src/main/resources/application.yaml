# Конфигурация java-agent. Переменные — из .env.example (AGENT_*, ALFA_PG_*).
server:
  port: ${AGENT_HTTP_PORT:8081}

spring:
  application:
    name: java-agent
  datasource:
    url: jdbc:postgresql://${ALFA_PG_HOST:localhost}:${ALFA_PG_PORT:5432}/${ALFA_PG_DATABASE:alfa}?sslmode=${ALFA_PG_SSLMODE:disable}
    username: ${ALFA_PG_USER:alfa}
    password: ${ALFA_PG_PASSWORD:alfa}

agent:
  gateway:
    base-url: ${AGENT_GATEWAY_BASE_URL:http://llm-gateway:8091}
    token: ${AGENT_GATEWAY_TOKEN:}
    connect-timeout: ${AGENT_GATEWAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${AGENT_GATEWAY_READ_TIMEOUT:90s}
    retries: ${AGENT_GATEWAY_RETRIES:3}
    structured-outputs: ${AGENT_GATEWAY_STRUCTURED_OUTPUTS:true}
  model-version: ${AGENT_MODEL_VERSION:v0.1}
  actor: ${AGENT_ACTOR:java}
  rag:
    lexical-min-score: ${AGENT_RAG_LEXICAL_MIN:0.15}
    vector-min-score: ${AGENT_RAG_VECTOR_MIN:0.5}
    rrf-k: ${AGENT_RAG_RRF_K:60}
    max-statements: ${AGENT_RAG_MAX_STATEMENTS:3}
    candidate-limit: ${AGENT_RAG_CANDIDATE_LIMIT:20}
  budget:
    max-tool-calls: ${AGENT_BUDGET_MAX_TOOL_CALLS:6}
    max-critic-iterations: ${AGENT_BUDGET_MAX_CRITIC_ITERATIONS:2}
    max-tokens-per-run: ${AGENT_BUDGET_MAX_TOKENS_PER_RUN:20000}
  qa:
    max-answer-tokens: ${AGENT_QA_MAX_ANSWER_TOKENS:600}
    max-question-chars: ${AGENT_QA_MAX_QUESTION_CHARS:1000}
    max-tool-calls: ${AGENT_QA_MAX_TOOL_CALLS:3}
  selfcheck:
    enabled: ${AGENT_SELFCHECK_ENABLED:false}

logging:
  level:
    root: ${AGENT_LOG_LEVEL:info}
