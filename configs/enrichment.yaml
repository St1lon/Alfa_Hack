  - name: КИТАЙ
    terms: [китай, китая$, китаю$, китаем$, китайск, кнр$, пекин]
  - name: ТУРЦИЯ
    terms: [турци, турецк, анкар, стамбул]
  - name: ИНДИЯ
    terms: [индия$, индии$, индию$, индией$, индийск, нью-дели]
  - name: ОАЭ
    terms: [оаэ$, эмират, дубай, дубае$, абу-даби]
  - name: УЗБЕКИСТАН
    terms: [узбекистан, узбекск, ташкент]
  - name: КАЗАХСТАН
    terms: [казахстан, казахск, астан]
  - name: БЕЛАРУСЬ
    terms: [беларус, белорус, белорусс]
  - name: ЛИТВА
    terms: [литв, литовск]
  - name: ЛАТВИЯ
    terms: [латви, латвийск]
  - name: ЭСТОНИЯ
    terms: [эстони, эстонск]
  - name: ПОЛЬША
    terms: [польш, польск, варшав]
  - name: ГЕРМАНИЯ
    terms: [германи, немецк, фрг$, берлин]
  - name: ИТАЛИЯ
    terms: [итали, итальянск]
  - name: ГОНКОНГ
    terms: [гонконг]
  - name: ЮЖНАЯ КОРЕЯ
    terms: [южная корея, южной корее, южной кореи, южнокорейск, сеул]
  - name: ЯПОНИЯ
    terms: [япони, японск, токио]
  - name: ВЬЕТНАМ
    terms: [вьетнам]
  - name: ГРУЗИЯ
    terms: [грузи, грузинск, тбилиси]
  - name: АЗЕРБАЙДЖАН
    terms: [азербайджан, баку$]
  - name: АРМЕНИЯ
    terms: [армени, армянск, ереван]
  - name: ИРАН
    terms: [иран$, ирана$, ирану$, ираном$, иранск, тегеран]
  - name: ЕГИПЕТ
    terms: [египет, египта$, египте$, египетск]
  - name: США
    terms: [сша$, вашингтон]
  - name: СЕРБИЯ
    terms: [серби, сербск]
  - name: МОНГОЛИЯ
    terms: [монголи, монгольск]

commodities:
  - name: нефть
    terms: [нефт, brent, urals]
  - name: газ
    terms: [газ$, газу$, газом$, газов, спг$, сжиженн]
  - name: нефтепродукты
    terms: [дизел, бензин, топлив, мазут, керосин]
  - name: уголь
    terms: [уголь$, угля$, угольн]
  - name: сталь
    terms: [сталь$, стальн, прокат, сталелит]
  - name: цветные металлы
    terms: [никел, алюмини, медь$, меди$]
  - name: золото
    terms: [золот, драгметалл]
  - name: зерно
    terms: [зерн, пшениц, ячмен, кукуруз]
  - name: удобрения
    terms: [удобрени, аммиак, карбамид]

# Риск-теги — те же, что у продуктов КИБ в плане Java (TEAM_PLAN §7).
risk_tags:
  - name: rate_risk
    terms: [ключевая ставка, ключевую ставку, ключевой ставки, ключевой ставке, ставку цб, банк россии, денежно-кредитн, дкп$, стоимость заимствован]
  - name: fx_risk
    terms: [курс рубл, курс доллар, курс юан, курс евро, валютн, девальвац, укреплени рубл, ослаблени рубл]
  - name: trade_restriction
    terms: [пошлин, санкц, эмбарго, квот, запрет на экспорт, запрет на импорт, ограничени на экспорт, ограничени на импорт]
  - name: supply_chain
    terms: [цепоч, поставок$, поставки$, дефицит, логист, сроки доставки]
  - name: export
    terms: [экспорт]
  - name: import
    terms: [импорт, параллельн импорт]
  - name: inflation
    terms: [инфляц, подорож, рост цен, удорожан]
  - name: liquidity_gap
    terms: [неплатеж, кассов разрыв, оборотн средств, отсрочк платеж, просрочк]
  - name: capex
    terms: [инвестпроект, капвложен, капитальн вложен, строительство завода, модернизац]

