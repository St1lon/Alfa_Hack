# Словари fallback-обогащения новостей (G1-15, USE_ML_FALLBACK=true).
#
# Это штатный режим первых дней, пока py-ml не готов: без моделей и токенов,
# по словарям. Результат пишется в news_enrichment с model_version из поля version.
# Go #2 сопоставляет его с признаками компании — поэтому:
#   * группы ОКВЭД — те, что реально доминируют в df_Uid_data_hack.csv
#     (46 опт, 68 недвижимость, 41 стройка, 56 общепит, 62 IT, ...) плюс отрасли
#     демо-архетипов (24 металлургия, 01 агро, 06/19 нефть и топливо);
#   * страны — в написании ФТС из данных (КИТАЙ, ТУРЦИЯ, ОАЭ, ...), чтобы
#     сравнение с FTS_COUNTRY_NAME было простым равенством;
#   * риск-теги — те же, что у продуктов КИБ в плане Java (rate_risk, fx_risk...).
#
# Как писать термины:
#   металлург      — префикс слова: металлург, металлургия, металлургический
#   газ$           — слово целиком: «газ», но не «газета»
#   ключевая ставка — фраза (есть пробел или знак): ищется подстрокой в тексте
# Буква «ё» заменяется на «е» и в тексте, и в словаре.

version: lexical-v3

industries:
  - code: "46"
    label: Оптовая торговля
    # точные формы: префикс «оптов» съедал «оптоволокно»
    terms: [оптовая$, оптовые$, оптового$, оптовой$, оптовым$, оптовых$, оптовую$, оптом$, оптовик, дистрибут, дистрибьют, поставщик]
  - code: "47"
    label: Розничная торговля
    terms: [ритейл, ретейл, розниц, маркетплейс, магазин, торговых сет, торговой сет, wildberries, ozon$]
  - code: "45"
    label: Автомобили и автоторговля
    terms: [автопром, автоконцерн, автозавод, автодилер, автомобил, автоваз, камаз, автокредит, утильсбор]
  - code: "68"
    label: Недвижимость
    terms: [недвижимост, ипотек, аренд, жилья$, жилье$, жилищн, квартир, новостро, коммерческой недвижимости]
  - code: "41"
    label: Строительство
    terms: [строител, застройщ, девелопер, стройк, домострое, жилищное строительство, ввод жилья]
  - code: "56"
    label: Общепит
    terms: [ресторан, общепит, кафе$, фастфуд, доставка еды]
  - code: "62"
    label: IT и цифровые сервисы
    terms: [айти$, it-компан, ит-компан, программн, софт$, цифровиз, искусственн интеллект, нейросет, кибер, облачн]
  - code: "64"
    label: Финансы и банки
    terms: [банк$, банка$, банки$, банке$, банку$, банком$, банков, кредит, заемщик, займ, облигац, офз$, депозит, вклад, лизинг, факторинг, ликвидност, дивиденд, бирж, фондов рынок, инвестор]
  - code: "49"
    label: Ж/д и автоперевозки
    terms: [ржд$, железнодорож, ж/д, вагон, грузоперевоз, перевозчик, грузовик, фур$, фуры$, вэд-логист]
  - code: "50"
    label: Морской транспорт и порты
    terms: [порт$, порта$, порту$, портов$, порты$, морск, судоход, фрахт, танкер, контейнеровоз, балкер, ормузск, суэцк, красное море, красном море]
  - code: "52"
    label: Логистика и склады
    terms: [логист, склад, цепоч, транзит, контейнер]
  - code: "24"
    label: Металлургия
    terms: [металлург, сталь$, стальн, сталелит, прокат, чугун, ферросплав, никел, алюмини, медь$, меди$, руда$, руды$, рудн, северсталь, нлмк, ммк$, мечел, евраз, норникел, русал]
  - code: "24.41"
    label: Золото и драгметаллы
    terms: [золот, серебр, платин, паллади, драгметалл, драгоценн металл]
  - code: "06"
    label: Нефть и газ
    # без «газа$»: это чаще всего сектор Газа, а не газ
    terms: [нефт, газ$, газу$, газом$, газов, газодобыч, спг$, сжиженн, опек, brent, urals, газпром, роснефт, лукойл, новатэк, ормузск]
  - code: "19"
    label: Нефтепродукты и топливо
    terms: [нпз$, топлив, дизтоплив, бензин, дизел, керосин, нефтепродукт, мазут, азс$, демпфер]
  - code: "05"
    label: Уголь
    terms: [уголь$, угля$, углю$, угольн]
  - code: "20"
    label: Химия и удобрения
    terms: [удобрени, химическ, аммиак, карбамид, калийн, фосагро, уралкали]
  - code: "01"
    label: Сельское хозяйство
    terms: [агро, сельхоз, зерн, пшениц, урожа, ячмен, кукуруз, подсолнечн, сахар, животновод, птицевод, молочн]
  - code: "35"
    label: Электроэнергетика
    terms: [электроэнерг, энергосистем, электростанц, энергоблок, аэс$, тэс$, гэс$, росатом, интер рао]
  - code: "86"
    label: Здравоохранение и фарма
    terms: [фарм, лекарств, медицинск, клиник, больниц]

